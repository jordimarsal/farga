[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "farga"
version = "0.1.0"
description = "Concept-to-PR pipeline over the personal stack: manifest as the single contract, evidence-based model routing (debrief + buildwright), SDD execution via harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordi Marçal Poy" }]
requires-python = ">=3.12"
keywords = ["pipeline", "agent-orchestration", "model-routing", "sdd", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0.3",
]

[project.scripts]
farga = "farga.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/farga"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
mypy_path = "src"
strict = true
